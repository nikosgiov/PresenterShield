name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Publish App
      run: dotnet publish PresenterShield.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/PresenterShield.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
